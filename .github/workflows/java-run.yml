 name: Run Java Program

on: [push]

jobs:
  run-java:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Compile
        run: javac App1/src/*.java

      - name: Run
        run: java -cp App1/src Main
