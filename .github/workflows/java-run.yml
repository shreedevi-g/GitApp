  name: Run Java Program

on: [push]

jobs:
  run-java:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Compile Java
        run: javac App1/src/pack1/Main.java

      - name: Run Java
        run: java -cp App1/src pack1.Main 
